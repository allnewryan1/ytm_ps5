# Adds new, reopened and transferred issues to a GitHub Project. Off until both exist:
#   repository variable ROADMAP_PROJECT_URL  e.g. https://github.com/users/<you>/projects/<n>
#   repository secret   ADD_TO_PROJECT_PAT   a token with Projects read/write
name: add to project

on:
  issues:
    types: [opened, reopened, transferred]

permissions: {}

jobs:
  add-to-project:
    if: ${{ vars.ROADMAP_PROJECT_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: ${{ vars.ROADMAP_PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
