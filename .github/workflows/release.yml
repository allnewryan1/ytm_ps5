# YouTube Music PS5 release
#
# Runs only after the "build" workflow finishes green on main. That workflow
# is the test: it links the payload, packages the homebrew folder, and
# rejects an ELF that used the host loader. This job does not rebuild. It
# publishes the artifact that already passed.
#
# Tag is v<VERSION>-<short sha> of the tested commit, so each green main
# build gets its own release and "latest" is the newest one that passed.
name: release

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the tested payload
        uses: actions/download-artifact@v8
        with:
          name: ytmusic-elf
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve version
        id: ver
        run: |
          set -eu
          VER="$(tr -d '[:space:]' < VERSION)"
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT="$(printf '%s' "$SHA" | cut -c1-7)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        run: |
          set -eu
          ELF="$(find artifact -type f -name ytmusic.elf | head -1)"
          HB="$(find artifact -type d -name YouTubeMusic | head -1)"
          test -n "$ELF"
          test -n "$HB"
          test -s "$ELF"
          test -s "$HB/eboot.elf"
          test -s "$HB/homebrew.js"
          mkdir -p dist/release
          T="${{ steps.ver.outputs.tag }}"
          cp "$ELF" "dist/release/ytmusic-${T}.elf"
          tar -C "$(dirname "$HB")" -czf "dist/release/YouTubeMusic-${T}-homebrew.tar.gz" "$(basename "$HB")"
          ( cd dist/release && sha256sum -- * > SHA256SUMS.txt )
          ls -la dist/release

      - name: Release notes
        run: |
          set -eu
          V="${{ steps.ver.outputs.version }}"
          if awk -v v="## ${V}" '
                $0 == v {found=1; next}
                found && /^## / {exit}
                found {print}
              ' CHANGELOG.md > dist/release/NOTES.md && [ -s dist/release/NOTES.md ]; then
            printf '\n---\n\n' >> dist/release/NOTES.md
          else
            echo "::warning::no CHANGELOG section for ${V}"
            : > dist/release/NOTES.md
          fi
          cat >> dist/release/NOTES.md <<EOF
          ## Install

          Two files from the same tested build:

          * \`ytmusic-*.elf\` — send to the ELF loader already listening on port 9021.
          * \`YouTubeMusic-*-homebrew.tar.gz\` — unpack and copy the folder to \`/data/homebrew/\` if your setup launches folders.

          This repository does not include a jailbreak. The console has to be on firmware 13.60 and already running a loader.

          ## Verification

          Published because the [build workflow](${{ github.event.workflow_run.html_url }}) passed on \`${{ steps.ver.outputs.sha }}\`. That run linked the payload with clang 18, PS5 Payload SDK v0.42, and pacbrew v0.39, and rejected the ELF if it used the host loader. CI has no console, so this build is not hardware-tested. Checksums are in \`SHA256SUMS.txt\`.
          EOF

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ steps.ver.outputs.sha }}
          name: v${{ steps.ver.outputs.version }}
          body_path: dist/release/NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/release/ytmusic-*.elf
            dist/release/YouTubeMusic-*-homebrew.tar.gz
            dist/release/SHA256SUMS.txt
