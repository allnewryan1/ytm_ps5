# Publishes the artifact from a green "build" run on main. Nothing is rebuilt.
# The tag is v<VERSION>-<short sha>, so every green main build is its own release.
name: release

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Download the tested build
        uses: actions/download-artifact@v8
        with:
          name: ytmusic-elf
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Version and tag
        id: ver
        run: |
          set -eu
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Package files
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          test -s artifact/ytmusic.elf
          test -s artifact/dist/PPSA99105/eboot.bin
          mkdir -p dist/release
          cp artifact/ytmusic.elf "dist/release/ytmusic-${TAG}.elf"
          (cd artifact/dist && zip -qr ../../dist/release/PPSA99105.zip PPSA99105)
          (cd dist/release && sha256sum -- *.elf *.zip > SHA256SUMS.txt)
          ls -la dist/release

      - name: Release notes
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          awk -v v="## ${VER}" '$0 == v {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md \
            > dist/release/NOTES.md
          if [ -s dist/release/NOTES.md ]; then
            printf '\n---\n\n' >> dist/release/NOTES.md
          else
            echo "::warning::no CHANGELOG section for ${VER}"
          fi
          cat >> dist/release/NOTES.md <<'NOTES'
          ## Install

          Two files from the same tested build:

          * `ytmusic-*.elf`: send to the ELF loader already listening on port 9021.
          * `PPSA99105.zip`: unzip and copy the `PPSA99105` folder to `/data/homebrew/`. ShadowMountPlus wants `eboot.bin` at `/data/homebrew/PPSA99105/eboot.bin`, plus `sce_module/libc.prx` and `sce_sys/`. Do not put the zip itself in that folder.

          This repository does not include a jailbreak.
          NOTES

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ env.SHA }}
          name: v${{ steps.ver.outputs.version }}
          body_path: dist/release/NOTES.md
          make_latest: true
          files: |
            dist/release/ytmusic-*.elf
            dist/release/PPSA99105.zip
            dist/release/SHA256SUMS.txt
