# Labels a new issue from words in its title (and, for audio, its body).
name: issue triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            // Whole words only: a bare substring test put "ui" on "build" and "quit".
            const has = (text, words) => words.some((w) => new RegExp(`(^|[^a-z0-9])${w}([^a-z0-9]|$)`).test(text));
            const rules = [
              ['bug', has(title, ['\\[bug\\]', 'bug', 'crash', 'crashes', 'error', 'freeze', 'freezes'])],
              ['enhancement', has(title, ['\\[feature\\]', 'feat', 'feature', '\\[enhancement\\]'])],
              ['documentation', has(title, ['\\[docs\\]', 'docs?', 'readme'])],
              ['audio', has(title, ['audio', 'sound', 'volume', 'ffmpeg']) || has(body, ['audio', 'sound'])],
              ['network', has(title, ['http', 'network', 'innertube', 'search', '400', '403'])],
              ['ui', has(title, ['ui', 'menu', 'keyboard', 'focus', 'controller', 'dualsense', 'art'])],
              ['playback', has(title, ['playback', 'decode', 'stream', 'queue', 'seek', 'skips?'])],
              ['library', has(title, ['library', 'liked', 'playlists?'])],
            ];
            const labels = rules.filter(([, hit]) => hit).map(([name]) => name);
            if (labels.length) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.payload.issue.number,
                labels,
              });
            }
