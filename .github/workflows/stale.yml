# Marks issues and pull requests stale after 60 quiet days and closes them 14 days later.
name: stale

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-all-milestones: true
          exempt-issue-labels: "pinned,security,good first issue"
          stale-issue-message: "No activity for 60 days. This will close in 14 days unless there is an update."
          stale-pr-message: "No activity for 60 days. This will close in 14 days unless there is an update."
          close-issue-message: "Closed after 14 more days without activity. Reopen it if it still applies."
          close-pr-message: "Closed after 14 more days without activity."
