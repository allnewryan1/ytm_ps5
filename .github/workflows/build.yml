# YouTube Music PS5 CI
#
# Same idea as EVO Player's build.yml: the runner uses this repo's Dockerfile
# with the same pinned LLVM 18 / Payload SDK v0.42 / pacbrew v0.39, then
# proves the payload still links. A GitHub runner has no PS5, so nothing here
# sends an ELF to a console.
name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

env:
  LLVM_VERSION: "18"
  PS5_SDK_VERSION: "v0.42"
  PACBREW_VERSION: "v0.39"

jobs:
  build-image:
    name: Build dev image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image with layer cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ytm-ps5/dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            LLVM_VERSION=${{ env.LLVM_VERSION }}
            PS5_SDK_VERSION=${{ env.PS5_SDK_VERSION }}
            PACBREW_VERSION=${{ env.PACBREW_VERSION }}

      - name: Export image
        run: docker save ytm-ps5/dev:ci | gzip -1 > /tmp/ytm-image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: /tmp/ytm-image.tar.gz
          retention-days: 1

  build-payload:
    name: Build ytmusic.elf
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp
      - run: docker load < /tmp/ytm-image.tar.gz

      - name: Encode launcher backgrounds
        run: |
          sh scripts/decode-assets.sh
          python3 -m pip install --user pillow numpy
          python3 scripts/encode-bc7.py sce_sys/background-source.jpg sce_sys/pic0.dds
          python3 scripts/encode-bc7.py sce_sys/launch-background-source.jpg sce_sys/pic1.dds

      - name: make
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            ytm-ps5/dev:ci bash -lc 'make && make package'

      - name: Validate ELF
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            ytm-ps5/dev:ci bash -lc '
              set -e
              f=ytmusic.elf
              file "$f" | grep -q "ELF 64-bit LSB.*x86-64" \
                || { echo "not an x86-64 ELF"; exit 1; }
              llvm-readelf -l "$f" | grep -q "/lib64/ld-linux" \
                && { echo "links the HOST loader - built with the wrong compiler"; exit 1; }
              llvm-readelf -h "$f" | grep -qE "Type:.*(DYN|EXEC)" \
                || { echo "unexpected ELF type"; exit 1; }
              test -f dist/PPSA99105/eboot.bin
              test ! -e dist/PPSA99105/eboot.elf
              test -f dist/PPSA99105/sce_module/libc.prx
              test -f dist/PPSA99105/homebrew.js
              test -f dist/PPSA99105/sce_sys/icon0.png
              test -f dist/PPSA99105/sce_sys/pic0.dds
              test -f dist/PPSA99105/sce_sys/pic1.dds
              magic=$(od -An -t x1 -N 4 dist/PPSA99105/eboot.bin | tr -d "[:space:]")
              test "$magic" = 4f153d1d
              prx=$(od -An -t x1 -N 4 dist/PPSA99105/sce_module/libc.prx | tr -d "[:space:]")
              test "$prx" = 5414f5ee
              etype=$(od -An -t x1 -j 16 -N 2 build/native/eboot.elf | tr -d "[:space:]")
              test "$etype" = 10fe
              echo "native eboot type 0xfe10"
              echo "validated $f"
            '

      - name: Archive payload
        uses: actions/upload-artifact@v7
        with:
          name: ytmusic-elf
          path: |
            ytmusic.elf
            dist/PPSA99105/
          if-no-files-found: error
          retention-days: 30

  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -e SC1091 -S warning scripts/*.sh
