# Builds ytmusic.elf and the PPSA99105 homebrew folder in this repository's Docker image
# (Ubuntu 24.04, LLVM 18, PS5 Payload SDK v0.42, pacbrew v0.39) and checks the output.
# CI has no console, so nothing runs on hardware. release.yml publishes a green main build.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_VERSION: "18"
  PS5_SDK_VERSION: "v0.42"
  PACBREW_VERSION: "v0.39"
  IMAGE: ytm-ps5/dev:ci

jobs:
  build:
    name: Build ytmusic.elf and PPSA99105
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the SDK image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            LLVM_VERSION=${{ env.LLVM_VERSION }}
            PS5_SDK_VERSION=${{ env.PS5_SDK_VERSION }}
            PACBREW_VERSION=${{ env.PACBREW_VERSION }}

      - name: Encode launcher images
        run: |
          sh scripts/decode-assets.sh
          python3 -m pip install --user pillow numpy
          python3 scripts/encode-bc7.py sce_sys/background-source.jpg sce_sys/pic0.dds
          python3 scripts/encode-bc7.py sce_sys/launch-background-source.jpg sce_sys/pic1.dds

      - name: Build and check
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" bash -lc '
            set -eu
            make
            make package
            app=dist/PPSA99105
            file ytmusic.elf | grep -q "ELF 64-bit LSB.*x86-64" || { echo "not an x86-64 ELF"; exit 1; }
            if llvm-readelf -l ytmusic.elf | grep -q /lib64/ld-linux; then
              echo "links the host loader: built with the wrong compiler"; exit 1
            fi
            llvm-readelf -h ytmusic.elf | grep -qE "Type:.*(DYN|EXEC)" || { echo "unexpected ELF type"; exit 1; }
            for f in eboot.bin sce_module/libc.prx homebrew.js sce_sys/param.json sce_sys/icon0.png \
                     sce_sys/pic0.dds sce_sys/pic1.dds; do
              test -s "$app/$f" || { echo "missing $app/$f"; exit 1; }
            done
            test ! -e "$app/eboot.elf"
            test "$(od -An -t x1 -N 4 "$app/eboot.bin" | tr -d "[:space:]")" = 4f153d1d
            test "$(od -An -t x1 -N 4 "$app/sce_module/libc.prx" | tr -d "[:space:]")" = 5414f5ee
            test "$(od -An -t x1 -j 16 -N 2 build/native/eboot.elf | tr -d "[:space:]")" = 10fe
            echo "ytmusic.elf and $app check out"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: ytmusic-elf
          path: |
            ytmusic.elf
            dist/PPSA99105/
          if-no-files-found: error
          retention-days: 30

  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          shellcheck -e SC1091 -S warning scripts/*.sh
