name: greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for opening your first issue on YouTube Music for PS5.

            Please include the firmware version, how you installed it (ELF loader or the PPSA99105 folder), the app version, and the status line shown on screen. This project does not include a jailbreak.
          pr_message: |
            Thanks for the pull request. The build workflow compiles it with the pinned SDK and checks the output. CI has no console, so please test on hardware.
